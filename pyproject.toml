[project]
name = "simple-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "theashishreddy", email = "ashishreddyblp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
simple-rag = "simple_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
